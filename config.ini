# Sampling is the official Qwen/Qwen3.8-27B thinking-mode block verbatim
# (temperature=1.0, top_p=0.95, top_k=20, min_p=0.0, presence_penalty=0.0,
# repetition_penalty=1.0). Abliteration does not move the recommended
# distribution - the base preset above already matches, so do not "tune" it.
#
# KV cache sizing, from the arch: only 16 of the 64 layers are full attention
# (the other 48 are Gated DeltaNet, which keep a small fixed recurrent state
# that does not scale with ctx). 4 KV heads x 256 dim = 1024 elems per K and
# per V, so 1664 B/token/layer at k=q8_0 v=q4_0 -> 26.6 KB/token -> 6.5 GiB
# at 262144 ctx, 2.5 GiB at 102400.
#
# MTP rides inline in this file (fused, shares the main token_embd/output
# tensors), so speculative decoding only needs --spec-type draft-mtp, no
# --model-draft file. Requires llama.cpp PR #22673+; this image is build
# 11046, fine. The card's sweep says n_max=2 is the knee (1.15-1.24x) and
# n_max>=3 is break-even or worse, so n_max=2 below.
#
# Vision is on here too: this is the text+image preset at 100k. The
# projector is loaded unconditionally, so text-only requests on this preset
# pay ~0.9GB of VRAM they do not need - measured 15.34/15.92 GiB with it off
# at 100k, so it is the difference between "fits" and "one more layer on the
# CPU". Use qwen-3.8-27b-uncensored-vision (65k) if you want the headroom,
# and qwen-3.8-27b-uncensored-262k for the native window text-only.
# Note llama.cpp disables prompt-cache reuse once a projector is attached.
# =========================
[qwen-3.8-27b-uncensored-100k]
model = /models/Qwen3.8-27B-Uncensored-IQ4_XS.gguf
mmproj = /models/qwen-3.8-27b/mmproj/mmproj-Qwen3.8-27B-Uncensored-F16.gguf
ctx-size = 102400

# Fit: keep as many layers on GPU as possible, rest to CPU.
# fit-target is a per-device margin in MiB, not a percentage.
fit = on
fit-target = 128
# Do not let --fit silently shrink ctx below what we asked for.
fit-ctx = 102400
parallel = 1

flash-attn = on
jinja = on
split-mode = layer


# Cache compression. 4-bit keys were the damaging half in ggml-org/llama.cpp
# #23470; the 16 full-attention layers are what this cache is made of.
cache-type-k = q8_0
cache-type-v = q4_0

batch-size = 2048
# 256 not 512: the ViT needs a compute buffer of its own and at 100k the
# card is full, so the extra ubatch just buys more CPU offload.
ubatch-size = 256
threads = 32

# thinking = on by default upstream; xhigh is also the upstream default.
# Supported levels are xhigh | medium | low.
reasoning = on
reasoning-effort = xhigh

# Qwen3.8 official sampling, thinking mode
temperature = 1.0
top-k = 20
top-p = 0.95
min-p = 0.0
presence-penalty = 0.0
repeat-penalty = 1.0

# preserve_thinking is on by default upstream; --reasoning-preserve is the
# llama.cpp-native way to hold it (enabled by default, and it keys off the
# template's supports_preserve_reasoning capability). Set to off to drop
# reasoning blocks from older turns.
reasoning-preserve = on

# MTP speculative decoding, n_max=2 per the model card's measured sweep.
spec-type = draft-mtp
spec-draft-n-max = 2

# Misc
no-warmup = true

# =========================
# Qwen3.8-27B Uncensored 262k (IQ4_XS, native context)
# Qwen3.8-27B is natively 262144 (extensible to 1M), so this is the real
# window rather than a stretched one.
#
# It does not fit in 16GB of VRAM: 15.3GB of weights + 6.5GiB of KV cache is
# ~21GiB, so --fit keeps the weights (and whatever KV it can) on the GPU and
# spills the rest to system RAM. Expect single-digit tok/s: this preset buys
# you the window, not speed. fit-ctx pins the context so --fit reduces
# offload rather than silently handing you a shorter window than you asked
# for. If that trade is wrong, use qwen-3.8-27b-uncensored-100k instead.
# =========================
[qwen-3.8-27b-uncensored-262k]
model = /models/Qwen3.8-27B-Uncensored-IQ4_XS.gguf
ctx-size = 262144

fit = on
fit-target = 128
fit-ctx = 262144
parallel = 1

flash-attn = on
jinja = on
split-mode = layer


# Same cache types as the 100k preset: ~6.5 GiB at this length. Dropping K to
# q4_0 would save ~1.7GiB but #23470 showed that is the half that hurts.
cache-type-k = q8_0
cache-type-v = q4_0

# Smaller ubatch: the compute buffer competes with KV cache for the same
# VRAM, and at 262k the KV cache is the scarce resource.
batch-size = 2048
ubatch-size = 256
threads = 32

reasoning = on
reasoning-effort = xhigh
reasoning-preserve = on

# Qwen3.8 official sampling, thinking mode
temperature = 1.0
top-k = 20
top-p = 0.95
min-p = 0.0
presence-penalty = 0.0
repeat-penalty = 1.0

spec-type = draft-mtp
spec-draft-n-max = 2

no-warmup = true

# =========================
# Qwen3.8-27B Uncensored Vision (IQ4_XS + mmproj)
# Uses this repo's own projector, not the base model's: the two files are
# different builds (base cbb841a9..., uncensored 5ac423f8...) even though
# both are 927.6MB. Published alongside the GGUF and named with the
# mmproj- prefix so compatible runtimes can auto-discover it.
# Context is 65k, not 262k: the vision tower adds its own encoder state and
# embed buffers on top of an already full 16GB card.
# =========================
[qwen-3.8-27b-uncensored-vision]
model = /models/Qwen3.8-27B-Uncensored-IQ4_XS.gguf
mmproj = /models/qwen-3.8-27b/mmproj/mmproj-Qwen3.8-27B-Uncensored-F16.gguf

ctx-size = 65536

fit = on
fit-target = 128
fit-ctx = 65536
parallel = 1

flash-attn = on
jinja = on
split-mode = layer


# Cache compression
cache-type-k = q8_0
cache-type-v = q4_0

batch-size = 2048
ubatch-size = 256
threads = 32

reasoning = on
reasoning-effort = xhigh
reasoning-preserve = on

# Qwen3.8 official sampling, thinking mode
temperature = 1.0
top-k = 20
top-p = 0.95
min-p = 0.0
presence-penalty = 0.0
repeat-penalty = 1.0

no-warmup = true
