# JonathanColetti/Qwen3.8-27B-Uncensored-GGUF. Refusal directions removed
# with Heretic (KL-minimising abliteration at bf16) and merged into the bf16
# base, then imatrix-quantised. mtp.* and the vision tower are copied
# verbatim from the base checkpoint, so the arch is byte-for-byte compatible
# with the base model: same 64 layers, 248320 vocab, 4 KV heads x 256 dim.
