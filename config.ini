# =========================
# Qwen-3.5-27B
# =========================
[qwen-3.5-27b]
model = /models/Qwen_Qwen3.5-27B-IQ3_M.gguf

# Qwen3.5/3.6/3.8 cards: "we advise maintaining a context length of at
# least 128K tokens to preserve thinking capabilities" (native 262K).
# The old 40072 was well under that floor.
ctx-size = 131072

# CRITICAL: Force 1 slot so you get the full context for ONE request
parallel = 1

# Vulkan Optimization
split-mode = layer

main-gpu = 0
flash-attn = on
jinja = on

# Cache compression
cache-type-k = q8_0
cache-type-v = q4_0

# Gated DeltaNet hybrid attention -> the KV cache is tiny, so ubatch can go
# to the llama.cpp default of 512 (was 256) for faster prefill.
batch-size = 2048
ubatch-size = 512
threads = 32

# Qwen/Qwen3.5-27B, thinking mode, precise coding (this server drives
# opencode): temperature=0.6, top_p=0.95, top_k=20, min_p=0.0,
# presence_penalty=0.0, repetition_penalty=1.0.
# For general chat instead: temperature=1.0 + presence-penalty=1.5.
reasoning = on
temperature = 0.6
top-k = 20
top-p = 0.95
min-p = 0.0
presence-penalty = 0.0
repeat-penalty = 1.0

# The GGUF chat template drops preserved thinking unless this is set, which
# breaks multi-turn prompt-cache reuse on Qwen3.5-arch models
# (ggml-org/llama.cpp#22384). No cache-reuse here: recurrent state cannot be
# chunk-shifted, so reuse comes from context checkpoints instead.
chat-template-kwargs = {"preserve_thinking": true}

no-warmup = true

